name: run-tests

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - php: '8.2'
                      laravel: '12.*'
                      testbench: '^10.0'
                      phpunit: '^11.5'
                    - php: '8.3'
                      laravel: '12.*'
                      testbench: '^10.0'
                      phpunit: '^11.5'
                    - php: '8.3'
                      laravel: '13.*'
                      testbench: '^11.0'
                      phpunit: '^12.0'
                    - php: '8.4'
                      laravel: '13.*'
                      testbench: '^11.0'
                      phpunit: '^12.0'
                    - php: '8.5'
                      laravel: '13.*'
                      testbench: '^11.0'
                      phpunit: '^12.0'

        name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite
                  coverage: none

            - name: Install dependencies
              run: |
                  composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
                  composer require --dev "orchestra/testbench:${{ matrix.testbench }}" "phpunit/phpunit:${{ matrix.phpunit }}" --no-interaction --no-update
                  composer update --prefer-stable --prefer-dist --no-interaction

            - name: Execute tests
              run: composer test

    quality:
        runs-on: ubuntu-latest
        name: Code quality
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.3'
                  coverage: none

            - name: Install dependencies
              run: composer update --prefer-stable --prefer-dist --no-interaction

            - name: Apply formatting
              run: composer format

            - name: Upload formatted source
              uses: actions/upload-artifact@v4
              with:
                  name: formatted-source
                  path: |
                      config
                      database
                      src
                      stubs
                      tests

            - name: Run static analysis
              run: composer analyse
